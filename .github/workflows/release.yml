name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  actions: read

jobs:
  publish:
    name: Build and publish Windows installer
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Wait for CI on tagged commit
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $sha = "${{ github.sha }}"
          $repository = "${{ github.repository }}"
          $deadline = (Get-Date).ToUniversalTime().AddMinutes(30)

          while ($true) {
            $runsJson = gh run list --repo $repository --workflow ci.yml --commit $sha --json status,conclusion,headSha --limit 10
            if ($LASTEXITCODE -ne 0) {
              throw "Unable to query CI runs for $sha."
            }

            $runs = @()
            if ($runsJson) {
              $runs = @($runsJson | ConvertFrom-Json | Where-Object { $_.headSha -eq $sha })
            }
            if ($runs.Count -gt 0) {
              $run = $runs[0]
              if ($run.status -eq "completed") {
                if ($run.conclusion -ne "success") {
                  throw "CI for $sha finished with conclusion '$($run.conclusion)'."
                }
                Write-Host "CI passed for $sha."
                break
              }
              Write-Host "CI for $sha is $($run.status); waiting..."
            } else {
              Write-Host "No CI run found for $sha; waiting..."
            }

            if ((Get-Date).ToUniversalTime() -ge $deadline) {
              throw "Timed out waiting for CI for $sha."
            }
            Start-Sleep -Seconds 15
          }

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - name: Verify release tag matches package version
        shell: pwsh
        run: |
          $version = (node -p "require('./package.json').version").Trim()
          $tagVersion = "${{ github.ref_name }}" -replace '^v', ''
          if ($version -ne $tagVersion) {
            throw "Tag ${{ github.ref_name }} does not match package version $version."
          }

      - run: npm run dist -- --publish never

      - name: Locate installer
        id: installer
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $installer = Get-Item "dist/Pesk-Setup-$version.exe"
          "path=$($installer.FullName)" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v7
        with:
          name: Pesk-Setup-${{ github.ref_name }}
          path: ${{ steps.installer.outputs.path }}
          if-no-files-found: error

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          INSTALLER: ${{ steps.installer.outputs.path }}
        run: |
          $version = node -p "require('./package.json').version"
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG $env:INSTALLER --clobber
          } else {
            gh release create $env:TAG $env:INSTALLER --title "Pesk $version" --generate-notes
          }
