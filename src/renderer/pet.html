<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pesk</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <main id="pet" aria-label="Desktop pet">
      <img
        id="pet-image"
        src="../../assets/pet-idle-1.svg"
        alt="Animated pet"
      />
      <span id="codex-status" aria-live="polite">
        <span id="codex-status-label">Idle</span>
        <span id="codex-aggregate-status-label" aria-live="polite" hidden>
          Other threads
        </span>
      </span>
      <audio id="codex-status-sound" preload="auto" hidden></audio>
    </main>
    <script type="module" src="renderer.js"></script>
  </body>
</html>
