<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pesk Menu</title>
  <link rel="stylesheet" href="menu.css" />
</head>

<body>
  <main>
    <div class="menu-heading">
      <h1>Pesk Menu</h1>
      <span id="focus-state" class="focus-state" aria-label="Focused"><i></i></span>
    </div>
    <p class="help">Use Tab to switch section, ↑/↓ to select, Enter to run, Esc to close.</p>
    <nav id="sections" aria-label="Menu sections">
      <button type="button" data-section="presets">Preset</button>
      <button type="button" data-section="animations">Animation</button>
      <button type="button" data-section="controls">Pet</button>
    </nav>
    <h2 id="section-title">Preset</h2>
    <section id="controls" aria-label="Pet actions" hidden></section>
    <section id="animations" aria-label="Animation actions" hidden></section>
    <section id="presets" aria-label="Preset actions">
      <input id="preset-search" type="search" placeholder="Search presets..." aria-label="Search presets" />
      <div id="preset-list"></div>
    </section>
  </main>
  <script type="module" src="menu.js"></script>
</body>

</html>
