<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pesk Chat</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body class="chat-only">
    <main id="chat" aria-label="Codex chat">
      <section id="codex-chat" aria-label="Codex chat">
        <div id="codex-chat-header">
          <select id="codex-session-select" aria-label="Codex session">
            <option value="">No active session</option>
          </select>
          <button
            id="codex-session-copy"
            type="button"
            aria-label="Copy session ID"
            title="Copy session ID"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="9" y="9" width="11" height="11" rx="2"></rect>
              <path d="M15 9V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h3"></path>
            </svg>
          </button>
          <button
            id="codex-changes-toggle"
            type="button"
            aria-label="View file changes"
            aria-expanded="false"
            title="View file changes in this thread"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5.5 3.5H13L18.5 9V20.5H5.5V3.5Z"></path>
              <path d="M13 3.5V9H18.5"></path>
              <path class="changes-added" d="M8.5 12.5H12"></path>
              <path class="changes-added" d="M15.5 12V15M14 13.5H17"></path>
              <path class="changes-removed" d="M8.5 16H12"></path>
              <path class="changes-removed" d="M14 18H17"></path>
            </svg>
          </button>
          <button
            id="codex-chat-lock"
            type="button"
            aria-label="Lock chat window"
            title="Keep chat visible when it loses focus (Ctrl+Shift+L)"
          >
            🔓
          </button>
        </div>
        <section
          id="codex-changes-panel"
          class="codex-changes-panel"
          aria-label="File changes"
          hidden
        >
          <div class="codex-changes-backdrop" data-changes-backdrop></div>
          <div class="codex-changes-dialog" role="dialog" aria-labelledby="codex-changes-title">
            <div class="codex-changes-header">
              <strong id="codex-changes-title">File changes</strong>
              <button type="button" data-changes-close aria-label="Close file changes">
                Close
              </button>
            </div>
            <div data-changes-content></div>
          </div>
        </section>
        <div id="codex-rate-limit" aria-live="polite" hidden></div>
        <div id="codex-error" role="alert" hidden></div>
        <div id="codex-history-shell">
          <div id="codex-goal" aria-live="polite" hidden></div>
          <div id="codex-history" aria-live="polite">
            <div id="codex-history-content"></div>
          </div>
          <div id="codex-status-dock">
            <div id="codex-command-notice" role="status" aria-live="polite" hidden></div>
            <div id="codex-working-status" aria-live="polite" hidden>
              <span>Working…</span>
              <time id="codex-working-elapsed">0s</time>
            </div>
          </div>
        </div>
        <div id="codex-token-usage-row">
          <div id="codex-token-usage" aria-live="polite" hidden></div>
          <span
            id="codex-mode-toggle"
            role="status"
            aria-label="Codex mode"
            title="Plan mode active"
            hidden
          >
            Plan
          </span>
        </div>
        <section id="rterm-panel" aria-label="Remote terminal" hidden>
          <div
            id="rterm-resize-handle"
            role="separator"
            aria-label="Resize remote terminal"
            aria-orientation="horizontal"
            tabindex="0"
          ></div>
          <div id="rterm-toolbar">
            <button
              id="rterm-refresh"
              type="button"
              aria-label="Refresh remote terminal"
              title="Refresh remote terminal"
            >
              <svg class="rterm-layout-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M20 11a8 8 0 0 0-14.7-4L3 10"></path>
                <path d="M3 5v5h5"></path>
                <path d="M4 13a8 8 0 0 0 14.7 4L21 14"></path>
                <path d="M21 19v-5h-5"></path>
              </svg>
            </button>
            <button
              id="rterm-layout"
              type="button"
              aria-label="Move remote terminal to the right side"
              title="Move remote terminal to the right side"
            >
              <svg class="rterm-layout-icon" viewBox="0 0 24 24" aria-hidden="true">
                <rect x="3" y="3" width="18" height="18" rx="2"></rect>
                <path d="M15 3v18"></path>
              </svg>
            </button>
            <button
              id="rterm-close"
              type="button"
              aria-label="Minimize remote terminal"
              title="Minimize remote terminal"
            >
              <svg class="rterm-layout-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M5 12h14"></path>
              </svg>
            </button>
          </div>
          <iframe id="rterm-frame" title="Remote terminal" tabindex="0"></iframe>
        </section>
        <div id="codex-read-only" aria-live="polite" hidden></div>
        <section id="codex-user-input" aria-live="assertive" hidden></section>
        <form id="codex-chat-form">
          <div id="codex-command-mode" aria-live="polite" hidden></div>
          <div id="codex-image-attachments" aria-live="polite" hidden></div>
          <div class="codex-input-wrap">
            <textarea
              id="codex-chat-input"
              rows="3"
              placeholder="Message Pesk..."
              aria-label="Message Codex"
            ></textarea>
            <button
              id="codex-image-select"
              class="codex-image-select"
              type="button"
              aria-label="Attach image"
              title="Attach image"
            >
              🖼️
            </button>
            <input id="codex-image-input" type="file" accept="image/*" multiple hidden />
          </div>
          <div id="codex-chat-actions">
            <button id="codex-chat-send" type="submit">Send</button>
          </div>
          <div
            id="codex-file-suggestions"
            role="listbox"
            aria-label="File suggestions"
            hidden
          ></div>
        </form>
      </section>
    </main>
    <script type="module" src="features/chat/chat-renderer.js"></script>
  </body>
</html>
